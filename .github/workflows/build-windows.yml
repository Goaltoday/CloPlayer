name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CloPlayer-Windows-x64-VST3
          path: build/CloPlayer_artefacts/Release/VST3/CloPlayer.vst3
          if-no-files-found: error
